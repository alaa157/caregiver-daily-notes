name: Android

on:
  push:
    branches: [main, preview/full-stack]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
    tags:
      - "demo-v*"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK (universal, minSdk 21)
        # Native Kotlin/Compose: one universal APK. Supported ABIs are whatever
        # the Android Gradle Plugin packages by default (arm64-v8a, armeabi-v7a,
        # x86_64) — no per-ABI splits.
        # Minify stays off (see app/build.gradle.kts): the old cross-platform
        # app crashed on launch with R8 and was never diagnosed.
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
        working-directory: android

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build squeezed APK (R8 + resource shrink, debug-signed)
        # Separate `minified` buildType: `release` stays minify-off until real
        # signing lands. First R8 build of the native app — smoke-test login
        # on device before trusting it (the old cross-platform app once died
        # under R8 and was never diagnosed).
        run: ./gradlew :app:assembleMinified --no-daemon
        working-directory: android

      - name: Upload squeezed APK
        uses: actions/upload-artifact@v4
        with:
          name: android-minified-apk
          path: android/app/build/outputs/apk/minified/app-minified.apk

  # Tag releases for team demos (plan §4): rebuilds the minified APK from
  # the tagged commit — never downloads artifacts across runs — and publishes
  # it. Debug APKs stay as pull-request/branch CI artifacts only.
  release-apk:
    if: startsWith(github.ref, 'refs/tags/demo-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build minified APK only
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleMinified --no-daemon
        working-directory: android

      - name: Publish demo release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/minified/app-minified.apk
          generate_release_notes: true
          prerelease: true
