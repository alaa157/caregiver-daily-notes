name: Android

# CI is temporarily paused for push events at the maintainer's request.
# To resume: revert this commit or un-comment the push block below.
# Manual runs remain available: Actions → Android → Run workflow.
on:
  workflow_dispatch:
  # push:
  #   branches: [main, preview/full-stack, feat/standalone-byok-ai]
  #   paths:
  #     - "android/**"
  #     - ".github/scripts/**"
  #     - ".github/workflows/android.yml"
  #   tags:
  #     - "demo-v*"
  pull_request:
    branches: [main, preview/full-stack, feat/standalone-byok-ai]
    paths:
      - "android/**"
      - ".github/scripts/**"
      - ".github/workflows/android.yml"

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK (universal, minSdk 21)
        # Native Kotlin/Compose: one universal APK. Supported ABIs are whatever
        # the Android Gradle Plugin packages by default (arm64-v8a, armeabi-v7a,
        # x86_64) — no per-ABI splits.
        # Minify stays off (see app/build.gradle.kts): the old cross-platform
        # app crashed on launch with R8 and was never diagnosed.
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
        working-directory: android

      - name: Run debug unit tests
        # Task 9: JVM unit tests (incl. DemoBackendApis, provider selection,
        # theme, ViewModels, string parity) run on every preview PR. The
        # Settings/locale regression tests (Robolectric Compose, no device)
        # run here too.
        run: ./gradlew :app:testDebugUnitTest --no-daemon
        working-directory: android

      - name: Run debug lint
        run: ./gradlew :app:lintDebug --no-daemon
        working-directory: android

      - name: Compile instrumentation test APK
        # The androidTest suite never executes in CI, but it must keep
        # compiling: without this step it silently rots against renamed or
        # moved composables and string keys.
        run: ./gradlew :app:assembleDebugAndroidTest --no-daemon
        working-directory: android

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build squeezed APK (R8 + resource shrink, shared demo key)
        # Separate `minified` buildType: `release` stays minify-off until real
        # signing lands. Shipped to testers via releases; the content gate
        # below checks the bytes before they are ever uploaded.
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: ./gradlew :app:assembleMinified --no-daemon
        working-directory: android

      - name: Verify squeezed APK contents
        # Version, Data & Backup actions, Arabic strings, and signer must all
        # be present in the actual demo artifact — catching R8/resource
        # shrink regressions and mislabeled versions at build time.
        run: bash .github/scripts/verify-demo-apk.sh android/app/build/outputs/apk/minified/app-minified.apk

      - name: Upload squeezed APK
        uses: actions/upload-artifact@v4
        with:
          name: android-minified-apk
          path: android/app/build/outputs/apk/minified/app-minified.apk

  # Tag releases for team demos (plan §4): rebuilds the minified APK from
  # the tagged commit — never downloads artifacts across runs — and publishes
  # it. Debug APKs stay as pull-request/branch CI artifacts only.
  release-apk:
    if: startsWith(github.ref, 'refs/tags/demo-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build minified APK only
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleMinified --no-daemon
        working-directory: android

      - name: Verify demo APK contents
        # Same gate as the branch runs: never publish bytes whose version,
        # Settings actions, Arabic strings or signer do not match.
        run: bash .github/scripts/verify-demo-apk.sh android/app/build/outputs/apk/minified/app-minified.apk

      - name: Publish demo release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/minified/app-minified.apk
          generate_release_notes: true
          prerelease: true
