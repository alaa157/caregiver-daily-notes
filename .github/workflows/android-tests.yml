name: Android tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-tests.yml"

jobs:
  jvm:
    name: JVM unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-jvm-reports
          path: android/app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 7

  instrumentation:
    name: Compose UI tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: cd android && ./gradlew :app:connectedDebugAndroidTest --console=plain

      - name: Upload instrumentation reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-reports
          path: android/app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 7
