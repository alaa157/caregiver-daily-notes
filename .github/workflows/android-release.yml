name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD EXPECTED_CERT_SHA256; do
            if [ -z "${!v}" ]; then echo "Missing secret: $v"; exit 1; fi
          done

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
          test -s /tmp/release.keystore

      - name: Build release APK
        env:
          KEYSTORE_PATH: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify release APK signature and pinned certificate
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK_COUNT=$(ls android/app/build/outputs/apk/release/*.apk | wc -l)
          if [ "$APK_COUNT" -ne 1 ]; then
            echo "Expected exactly one release APK, found $APK_COUNT"
            exit 1
          fi
          APK=$(ls android/app/build/outputs/apk/release/*.apk)
          APKSIGNER=$(find "$ANDROID_HOME" -name apksigner -type f | head -1)
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"
          FINGERPRINT=$(echo "$CERTS" | grep -i "SHA-256" | head -1 | sed 's/.*: *//' | tr -d ' :' | tr '[:lower:]' '[:upper:]')
          if [ -z "$FINGERPRINT" ]; then
            echo "Could not extract signer SHA-256 fingerprint"
            exit 1
          fi
          EXPECTED=$(echo "$EXPECTED_CERT_SHA256" | tr -d ' :' | tr '[:lower:]' '[:upper:]')
          if [ "$FINGERPRINT" != "$EXPECTED" ]; then
            echo "Certificate mismatch: got $FINGERPRINT, expected $EXPECTED"
            exit 1
          fi
          echo "Release certificate verified: $FINGERPRINT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk

  demo:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build minified demo APK
        working-directory: android
        run: ./gradlew :app:assembleMinified --no-daemon

      - name: Publish demo APK as prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}-demo" \
            android/app/build/outputs/apk/minified/*.apk \
            --prerelease \
            --title "${GITHUB_REF_NAME} (demo)" \
            --notes "Debug-signed minified demo build. Not for production updates."