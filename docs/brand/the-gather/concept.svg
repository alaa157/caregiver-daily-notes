<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">The Gather — Rafeek concept exploration</title><desc id="desc">Four rounded arc-fragments sit around a shared centre. No one fragment claims to be the whole; the negative space is as important as the pieces.</desc>
