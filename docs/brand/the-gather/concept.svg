<rect x="112" y="470" width="1176" height="1" fill="#DDE4D8"/>
<text x="112" y="548" font-family="Inter,sans-serif" font-size="22" font-weight="700" fill="#285B45">THE IDEA</text>
<text x="112" y="598" font-family="Inter,sans-serif" font-size="30" font-weight="600" fill="#213B32">A fuller picture emerges when separate observations are held together.</text>
