<text x="112" y="118" font-family="Inter,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#59695F">RAFEEK / BRAND EXPLORATION</text>
<text x="112" y="235" font-family="Inter,sans-serif" font-size="28" font-weight="700" fill="#C77F68">03 / Geometric · Intelligent</text>
<text x="112" y="332" font-family="Inter,sans-serif" font-size="82" font-weight="700" letter-spacing="-3" fill="#213B32">The Gather</text>
<text x="112" y="390" font-family="Inter,sans-serif" font-size="28" fill="#59695F">Small pieces become a whole.</text>
<g transform="translate(1050 180) scale(2.25)"><g fill="none" stroke="#285B45" stroke-width="10" stroke-linecap="round">
