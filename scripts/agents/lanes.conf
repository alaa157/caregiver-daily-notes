# Agent lanes — file ownership map
#
# Four agents run in parallel across TWO machines. This file is the single
# source of truth for which lane owns which file. It is committed to the repo
# so both machines read the same map.
#
# Format:  <lane> | <machine> | <path or directory/>
#   - a path ending in / is a directory prefix (everything under it)
#   - a path with no trailing / is an exact file
#   - "shared" as the machine means the lane exists on both machines
#
# Rules:
#   1. Every file an agent may edit appears here exactly once.
#   2. A file owned by one lane is never edited by another lane.
#   3. Files NOT listed here are unowned: the human wires them by hand.
#   4. Machine assignment controls which box runs the lane. It does not
#      change ownership; ownership is global.

