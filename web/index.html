<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var language = localStorage.getItem('caregiver-language');
          if (language === 'ar') {
            document.documentElement.lang = 'ar';
            document.documentElement.dir = 'rtl';
          }
        } catch (e) { /* Storage can be blocked; keep the default LTR document. */ }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/rafeek-icon.svg" />
    <meta name="theme-color" content="#fafaf6" />
    <script>
      // Apply the stored theme before first paint. This only covers the window
      // before React mounts (including the config-error screen); ThemeProvider
      // remains the runtime source of truth and updates the same attributes.
      (function () {
        var mode = null;
        try { mode = window.localStorage.getItem('caregiver-theme-mode'); } catch (e) {}
        if (mode !== 'light' && mode !== 'dark' && mode !== 'system') mode = 'system';
        document.documentElement.dataset.theme = mode;

        var prefersDark = false;
        try {
          prefersDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        } catch (e) {}
        var resolved = mode === 'dark' || (mode !== 'light' && prefersDark) ? 'dark' : 'light';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', resolved === 'dark' ? '#121616' : '#fafaf6');
      })();
    </script>
    <meta name="description" content="Record daily care notes, review clear summaries, and stay in control of suggested plans. Arabic and English support. Not medical advice." />
    <meta property="og:title" content="Rafeek" />
    <meta property="og:description" content="A calm place to record daily notes and review care-support summaries in Arabic or English." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%VITE_SITE_URL%/caregiver-notes-preview.png" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:site_name" content="Rafeek" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rafeek" />
    <meta name="twitter:description" content="A calm place to record daily notes and review care-support summaries in Arabic or English." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/caregiver-notes-preview.png" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <title>Rafeek</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
