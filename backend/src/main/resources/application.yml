# LLM provider configuration (Member 1 — Task 1 foundation).
# Tests never touch the network: they script HttpExchange / FakeLlmClient.
llm:
  # Chat-completions base. Requests go to POST {base-url}/chat/completions.
  # Primary provider: Gemini (OpenAI-compatible). Backup: OpenRouter LFM (see below).
  # Chain: Gemini -> OpenRouter -> template fallback -> "AI unavailable".
  base-url: https://generativelanguage.googleapis.com/v1beta/openai
  # Default model id; override per environment. Never hit by tests.
  # Locked 2026-10-07: gemini-3.5-flash-lite (free tier, 1000 RPD). Prompts must
  # constrain mood to an English enum (good/neutral/poor/...) — the model
  # otherwise returns Arabic values (see #29 probe).
  # Backup: liquid/lfm-2.5-2.6b:free via OpenRouter :free. Its mandatory
  # reasoning cap is configured below (500 tokens); read `content` only, strip
  # fences, and treat `length` as retry-never-success. Large generations on the
  # free shared pool can exceed the 30s timeout and fall back to the template.
  model: gemini-3.5-flash-lite
  # Per-attempt HTTP timeout. Mirrors LegacyHfLlmClient.REQUEST_TIMEOUT.
  timeout: 30s
  # Total attempts per call: initial try + 2 retries with exponential backoff.
  max-attempts: 3
  # Backoff base in ms; delay before retry N is base * 2^(N-1) (200, 400).
  backoff-base-ms: 200
  # Per-request output token budget for the primary provider.
  max-tokens: 10000
  # Primary reasoning cap (null = omit). Gemini needs none.
  reasoning-max-tokens:
  # Backup endpoint: repo defaults (they change with updates); key from env only.
  backup-base-url: https://openrouter.ai/api/v1
  backup-model: liquid/lfm-2.5-2.6b:free
  backup-max-tokens: 10000
  # LFM reasoning is mandatory: cap the trace so the answer fits the budget.
  backup-reasoning-max-tokens: 500
  backup-api-key: ${OPENROUTER_API_KEY:}
  # Primary key comes from the environment only. Never commit a real key.
  # Empty = unauthenticated requests (no Authorization header sent).
  api-key: ${GEMINI_API_KEY:}
