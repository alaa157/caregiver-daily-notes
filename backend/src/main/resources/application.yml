# API documentation is a development-only convenience. springdoc is disabled
# in the base configuration so /v3/api-docs and /swagger-ui do not exist in
# production (including the BYOK and AI endpoints they would advertise).
# The dev profile switches both back on (see application-dev.yml); the
# annotations stay on the controllers for development and client generation.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Auth/JWT configuration (Member 3 — Task 1 foundation).
# Signing secret comes from the environment only. Never commit a real secret.
auth:
  jwt:
    secret: ${JWT_SECRET}
    expiry: 24h

# Postgres via environment (DATABASE_URL must be a full jdbc:postgresql://… URL).
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

# LLM provider configuration.
# There are no server-configured providers and no provider API keys in the
# environment: every AI call carries request-scoped BYOK credentials supplied
# by the client (POST /api/summaries/byok, /api/plans/generate/byok,
# /api/ai/byok/connection-test). Calls without credentials fail closed.
# Tests never touch the network: they script HttpExchange / FakeLlmClient.
llm:
  # Per-attempt HTTP timeout. Mirrors ChatCompletionsLlmClient.REQUEST_TIMEOUT.
  timeout: 30s
  # Total attempts per call: initial try + 2 retries with exponential backoff.
  max-attempts: 3
  # Backoff base in ms; delay before retry N is base * 2^(N-1) (200, 400).
  backoff-base-ms: 200
  # Per-request output token budget.
  max-tokens: 10000
