android.useAndroidX=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
android.nonTransitiveRClass=true

# Rebuild speed. Keep the daemon alive, reuse task outputs and the
# configuration phase across runs. Do NOT pass --no-daemon locally;
# it defeats all three. Configuration cache problems are warnings, not
# failures, so an AGP/incompatibility downgrades instead of breaking builds.
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Bounded memory: this box is ~8 GB with no swap, and R8 in parallel with a
# second Kotlin daemon OOM-kills the build daemon. Keep one worker and a
# small Kotlin daemon so R8 stays within budget.
org.gradle.parallel=false
org.gradle.workers.max=1
kotlin.daemon.jvmargs=-Xmx1024m
